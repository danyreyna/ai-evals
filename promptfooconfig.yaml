# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "TODO"

prompts:
  - file://tests/prompts/prompt-to-test.md

providers:
  - id: anthropic:claude-agent-sdk
    config:
      # Authenticate with subscription: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
      apiKeyRequired: false
      # Prevent saving evaluations' transcripts to local directory at ~/.claude/projects/
      persist_session: false
      # Disable LLM request/response caching
      bustCache: true
      custom_system_prompt: ""
      model: haiku
      effort: xhigh
      working_dir: ./working-dir
      disallowed_tools: ["WebFetch", "WebSearch"]
      max_budget_usd: 0.50

evaluateOptions:
  repeat: 20

defaultTest:
  options:
    # Default grader. Text-only: no `working_dir` and no `tools`, so it only judges the output.
    provider:
      id: anthropic:claude-agent-sdk
      config:
        # Authenticate with subscription: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
        apiKeyRequired: false
        # Prevent saving evaluations' transcripts to local directory at ~/.claude/projects/
        persist_session: false
        # Disable LLM request/response caching
        bustCache: true
        custom_system_prompt: ""
        model: haiku
        effort: xhigh
        output_format:
          type: json_schema
          schema:
            type: object
            required: [reason, score, pass]
            additionalProperties: false
            properties:
              reason:
                type: string
                description: Analysis of the rubric against the output and evidence gathered
              score:
                type: number
                description: Score from 0.0 to 1.0
              pass:
                type: boolean

tests:
  - file://tests/prompt-tests.yaml

outputPath:
  - tests/evaluations/results.json
  - tests/evaluations/results.html
