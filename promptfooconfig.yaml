# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Prompt evaluation and iteration exercise for a given task."

prompts:
  - file://tests/prompts/prompt-to-test.md

providers:
  - id: anthropic:claude-agent-sdk
    config:
      # Required to use with local Claude Code: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
      apiKeyRequired: false
      # Don't add evaluations transcripts to Claude Code at ~/.claude/projects/
      persist_session: false
      model: sonnet
      effort: medium
      working_dir: ./src
      # The task is "write a test file and make it pass", so the agent needs to write files and run `bun test`.
      # Don't use `copy_working_dir`: a copy of `./src` has no `node_modules`, so `msw` would not resolve.
      # Isolation comes from:
      # - `maxConcurrency: 1` in `evaluateOptions` below
      # - the git reset in the hook at `tests/hooks/working-dir.mjs`
      append_allowed_tools: ["Write", "Edit", "MultiEdit", "Bash"]
      disallowed_tools: ["WebFetch", "WebSearch"]
      permission_mode: acceptEdits
      ask_user_question:
        behavior: first_option

# Reset `src/` before every run.
# Snapshot the test files the agent under test creates to `tests/evaluations/generated/`
extensions:
  - file://tests/hooks/working-dir.mjs:extensionHook

evaluateOptions:
  # Isolate runs since every run writes to the same file.
  maxConcurrency: 1
  repeat: 10
  timeoutMs: 900000

defaultTest:
  options:
    # Default grader. Text-only: no `working_dir` and no `tools`, so it only judges the output.
    provider:
      id: anthropic:claude-agent-sdk
      config:
        # Required to use with local Claude Code: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
        apiKeyRequired: false
        # Don't add evaluations transcripts to Claude Code at ~/.claude/projects/
        persist_session: false
        model: sonnet
        effort: low

tests:
  - file://tests/prompt-tests.yaml

outputPath:
  - tests/evaluations/results.json
  - tests/evaluations/results.html
