# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Prompt evaluation and iteration exercise for a given task."

prompts:
  - file://src/prompt-to-test.md

providers:
  - id: anthropic:claude-agent-sdk
    label: "local-claude-code"
    config:
      # Required to use with local Claude Code: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
      apiKeyRequired: false
      model: sonnet
      effort: medium
      working_dir: ./src
      tools:
        type: preset
        preset: claude_code
      setting_sources: ["project"]
      append_allowed_tools: ["AskUserQuestion"]
      ask_user_question:
        behavior: first_option

defaultTest:
  options:
    # Default grader
    provider: "local-claude-code"

tests:
  - vars:
      topic: bananas

  - vars:
      topic: avocado toast
    assert:
      # For more information on assertions, see https://promptfoo.dev/docs/configuration/expected-outputs

      # Make sure output contains the word "avocado"
      - type: icontains
        value: avocado

      # Prefer shorter outputs
      - type: javascript
        value: 1 / (output.length + 1)

  - vars:
      topic: new york city
    assert:
      # For more information on model-graded evals, see https://promptfoo.dev/docs/configuration/expected-outputs/model-graded
      - type: llm-rubric
        value: ensure that the output is funny

  # TODO: coding agent
  - assert:
      - type: agent-rubric
        value: Verify that the output accurately describes the exported API in src/report.ts.
        provider:
          id: openai:codex-sdk
          config:
            working_dir: ./sample-project
            sandbox_mode: read-only
            approval_policy: never
            skip_git_repo_check: true
