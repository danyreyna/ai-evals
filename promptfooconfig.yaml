# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Prompt evaluation and iteration exercise for a given task."

prompts:
  - file://tests/prompts/prompt-to-test.md

providers:
  - id: anthropic:claude-agent-sdk
    config:
      # Required to use with local Claude Code: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
      apiKeyRequired: false
      # Don't add evaluations transcripts to Claude Code at ~/.claude/projects/
      persist_session: false
      model: haiku
      effort: high
      working_dir: ./src
      ask_user_question:
        behavior: first_option

defaultTest:
  options:
    # Default grader. Text-only: no `working_dir` and no `tools`, so it only judges the output.
    provider:
      id: anthropic:claude-agent-sdk
      config:
        # Required to use with local Claude Code: https://www.promptfoo.dev/docs/providers/claude-agent-sdk/#setup
        apiKeyRequired: false
        # Don't add evaluations transcripts to Claude Code at ~/.claude/projects/
        persist_session: false
        model: haiku
        effort: medium

tests:
  - file://tests/prompt-tests.yaml

outputPath:
  - tests/evaluations/results.json
  - tests/evaluations/results.html
